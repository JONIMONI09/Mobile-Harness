name: Build and Release Android App

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Linting
        run: ./gradlew lint

      - name: Run Tests
        run: ./gradlew test

      - name: Build Release APKs
        run: ./gradlew assembleRelease

      - name: Verify release APKs exist
        run: |
          test -f app/build/outputs/apk/offline/release/app-offline-release.apk
          test -f app/build/outputs/apk/online/release/app-online-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/offline/release/app-offline-release.apk
            app/build/outputs/apk/online/release/app-online-release.apk
          generate_release_notes: true
