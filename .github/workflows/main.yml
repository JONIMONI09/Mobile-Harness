name: Build and Release Android App

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Linting
        run: ./gradlew lint

      - name: Run Tests
        run: ./gradlew test

      - name: Build Release APKs
        run: ./gradlew assembleOfflineRelease assembleOnlineRelease

      - name: Inspect outputs
        run: find app/build/outputs -type f | sort

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      MH_UPLOAD_STORE_FILE: ${{ secrets.MH_UPLOAD_STORE_FILE }}
      MH_UPLOAD_STORE_PASSWORD: ${{ secrets.MH_UPLOAD_STORE_PASSWORD }}
      MH_UPLOAD_KEY_ALIAS: ${{ secrets.MH_UPLOAD_KEY_ALIAS }}
      MH_UPLOAD_KEY_PASSWORD: ${{ secrets.MH_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APKs
        run: ./gradlew assembleOfflineRelease assembleOnlineRelease

      - name: Verify signed release APKs exist
        run: |
          test -f app/build/outputs/apk/offline/release/app-offline-release.apk
          test -f app/build/outputs/apk/online/release/app-online-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/offline/release/app-offline-release.apk
            app/build/outputs/apk/online/release/app-online-release.apk
          generate_release_notes: true
