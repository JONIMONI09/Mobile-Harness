name: Build and Release Android App

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Delete oldest artifacts to free storage quota
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner, repo, per_page: 100
            });

            const targets = data.artifacts
              .filter(a => a.name === "Mobile-Harness-APK")
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            console.log(`Found ${targets.length} "Mobile-Harness-APK" artifact(s).`);

            const keep = 2;
            const toDelete = targets.slice(0, Math.max(0, targets.length - keep));
            console.log(`Will delete ${toDelete.length} old artifact(s), keeping ${Math.min(keep, targets.length)} newest.`);

            for (const artifact of toDelete) {
              console.log(`Deleting id=${artifact.id} created=${artifact.created_at} (${artifact.size_in_bytes} bytes)`);
              try {
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: artifact.id
                });
                console.log(`  -> OK`);
              } catch (e) {
                console.log(`  -> FAILED: ${e.message}`);
              }
            }
            console.log(`Cleanup done. Deleted ${toDelete.length} artifact(s).`);

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: .

      - name: Build release APKs
        run: ./gradlew assembleOfflineRelease assembleOnlineRelease

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/offline/release/app-offline-release-unsigned.apk release-assets/Mobile-Harness-offline.apk
          cp app/build/outputs/apk/online/release/app-online-release-unsigned.apk release-assets/Mobile-Harness-online.apk
          ls -lh release-assets/

      - name: Create GitHub Release (PRIMARY)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Build #${{ github.run_number }} (${{ github.ref_name }})"
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            Auto-generated build #${{ github.run_number }} from branch `${{ github.ref_name }}`.

            Download:
            - Mobile-Harness-offline.apk
            - Mobile-Harness-online.apk

            Commit: ${{ github.sha }}
          generate_release_notes: false
          files: |
            release-assets/Mobile-Harness-offline.apk
            release-assets/Mobile-Harness-online.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as workflow artifact (best-effort)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Mobile-Harness-APK
          path: |
            release-assets/Mobile-Harness-offline.apk
            release-assets/Mobile-Harness-online.apk
          if-no-files-found: warn
          retention-days: 3
